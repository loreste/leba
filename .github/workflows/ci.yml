name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Mako
        run: |
          set -euo pipefail
          # Same approach as release.yml: clone + path install (cargo --git hits quiche submodule URL issues).
          git clone --depth 1 https://github.com/loreste/mako.git "$HOME/mako"
          cd "$HOME/mako"
          git submodule update --init --recursive || {
            echo "WARN: submodule init incomplete; continuing without full quiche tree"
          }
          if cargo install --path . --bin mako --locked 2>/tmp/mako-install.err; then
            echo "mako installed (locked)"
          else
            cat /tmp/mako-install.err || true
            cargo install --path . --bin mako
          fi
          echo "MAKO_STD=$HOME/mako/std" >> "$GITHUB_ENV"
          echo "MAKO_RUNTIME=$HOME/mako/runtime" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/mako" version
          test -d "$HOME/mako/std/crypto"
          test -d "$HOME/mako/runtime"

      - name: Clean Mako object cache
        run: rm -rf .mako/cache

      - name: Unit tests
        run: make test

      - name: Build
        run: make build

      - name: Linux deploy assets
        run: make test-linux-assets

      - name: HA package assets
        run: make test-ha-assets

      - name: Docs and harness presence
        run: make test-docs

      - name: Concurrent smoke
        run: |
          set -euo pipefail
          make build
          chmod +x scripts/concurrent_smoke.sh
          ./scripts/concurrent_smoke.sh 120

      - name: Adversarial smoke
        run: |
          set -euo pipefail
          chmod +x scripts/adversarial_smoke.sh
          # Units already ran; script re-runs them — acceptable for isolation.
          ./scripts/adversarial_smoke.sh

      - name: Soak harness
        env:
          # Slightly smaller concurrent wave on GHA shared runners.
          SOAK_N: "120"
          SOAK_BATCH: "12"
        run: |
          set -euo pipefail
          make build
          chmod +x scripts/soak.sh
          ./scripts/soak.sh "${SOAK_N}" 6

      - name: HA peers smoke
        run: make test-ha-peers
